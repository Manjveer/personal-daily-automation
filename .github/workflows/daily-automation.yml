
name: Personal Daily Automation

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate daily message
        run: |
          mkdir -p daily

          TODAY=$(TZ=Asia/Kolkata date '+%Y-%m-%d')
          DATE=$(TZ=Asia/Kolkata date '+%A, %d %B %Y')
          TIME=$(TZ=Asia/Kolkata date '+%I:%M %p IST')

          cat > "daily/${TODAY}.md" <<EOF
          # Personal Daily Update

          **Date:** ${DATE}
          **Generated:** ${TIME}

          ## Good Morning!

          Your daily personal reminder is ready.

          ### Today's Priorities
          - [ ] Review today's schedule.
          - [ ] Identify your top three priorities.
          - [ ] Complete one important task.
          - [ ] Review your finances and commitments.

          ### Personal Note
          Start with clarity. Focus on progress, not perfection.

          ---
          Generated automatically by Personal Daily Automation.
          EOF

      - name: Save daily update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/
          git diff --cached --quiet || git commit -m "Add daily personal update"
          git push
